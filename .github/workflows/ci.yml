name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Configurar Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Smoke test do JAR com SQLite
        run: bash examples/demo.sh
      - name: Publicar JAR como artefato do workflow
        uses: actions/upload-artifact@v7.0.2
        with:
          name: calculadora-entregador-java21
          path: target/calculadora-entregador.jar
          if-no-files-found: error
      - name: Resultados dos testes
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: resultados-junit
          path: target/surefire-reports/
          if-no-files-found: ignore
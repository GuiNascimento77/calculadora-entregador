name: Publicar versao

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Configurar Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar e testar
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Validar JAR
        run: bash examples/demo.sh
      - name: Criar release v1.0.0 com JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 target/calculadora-entregador.jar \
            --target "$GITHUB_SHA" \
            --title "Calculadora do Entregador v1.0.0" \
            --notes-file docs/RELEASE-v1.0.0.md